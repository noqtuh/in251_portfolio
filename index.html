<!doctype html>
<html class="no-js" lang="">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="">

  <link rel="stylesheet" href="css/style.css">

      </article>

      <article class="paper-page" data-panel="skills" hidden>
